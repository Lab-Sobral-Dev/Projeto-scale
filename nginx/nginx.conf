# LOCAL: localhost (desenvolvimento)
server {
    listen 80;
    server_name localhost 127.0.0.1;

    location /api/ {
        proxy_pass http://scale_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://scale_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
}

# FRONTEND: scale.laboratoriosobral.com.br
upstream scale_frontend_upstream {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    server_name scale.laboratoriosobral.com.br;

    # --- Security headers ---
    add_header X-Content-Type-Options     "nosniff"                          always;
    add_header X-Frame-Options            "DENY"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    # HSTS: enviado ao browser pelo proxy externo (Cloudflare) via HTTPS
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://scale_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Entrega index.html em rotas SPA (refresh em /alguma/rota)
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }

    location = /index.html {
        proxy_pass http://scale_frontend_upstream/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# API: apiscale.laboratoriosobral.com.br
upstream scale_backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name apiscale.laboratoriosobral.com.br;

    # --- Security headers ---
    add_header X-Content-Type-Options     "nosniff"                          always;
    add_header X-Frame-Options            "DENY"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

    # --- BLOCO PRINCIPAL DE PROXY PARA DJANGO ---
    location / {
        proxy_pass http://scale_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- STATIC & MEDIA ---
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # --- NOVO BLOCO: BACKUPS PROTEGIDOS ---
    # Este bloco intercepta o cabeçalho X-Accel-Redirect enviado pelo Django
    location /protected/backups/ {
        internal;                           # Protege de acesso direto via URL pública
        alias /var/backups/scale/;          # Caminho dentro do container NGINX (montado via volume)
        autoindex off;

        # Headers de Segurança
        add_header X-Content-Type-Options nosniff;

        add_header 'Access-Control-Allow-Origin' "https://scale.laboratoriosobral.com.br" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition,Content-Length';
    }
}