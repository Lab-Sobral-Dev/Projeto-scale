# FRONTEND: scale.laboratoriosobral.com.br
server {
    listen 80;
    server_name scale.laboratoriosobral.com.br;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# API: apiscale.laboratoriosobral.com.br
upstream scale_backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name apiscale.laboratoriosobral.com.br;

    # --- BLOCO PRINCIPAL DE PROXY PARA DJANGO ---
    location / {
        proxy_pass http://scale_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- STATIC & MEDIA ---
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # --- NOVO BLOCO: BACKUPS PROTEGIDOS ---
    # Este bloco intercepta o cabeçalho X-Accel-Redirect enviado pelo Django
    location /protected/backups/ {
        internal;                           # Protege de acesso direto via URL pública
        alias /var/backups/scale/;          # Caminho dentro do container NGINX (montado via volume)
        autoindex off;

        # Headers de Segurança
        add_header X-Content-Type-Options nosniff;

        # === CORREÇÃO DE CORS ===
        # Permite que o frontend leia a resposta do arquivo entregue pelo Nginx
        # $http_origin pega automaticamente quem fez a requisição (seu frontend)
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Expõe o nome do arquivo para o Javascript ler (necessário para o Content-Disposition funcionar)
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition,Content-Length';
    }
}