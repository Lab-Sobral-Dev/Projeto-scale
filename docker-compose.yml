version: '3.8'

services:
  backend:
    build: ./backend
    container_name: scale_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_DIR: /var/backups/scale
      BACKUP_ACCEL_PREFIX: /protected/backups
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - backups_volume:/var/backups/scale
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    container_name: scale_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_DIR: /var/backups/scale
      BACKUP_ACCEL_PREFIX: /protected/backups
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    command: celery -A conf worker --loglevel=info
    depends_on:
      - backend
      - redis
    volumes:
      - backups_volume:/var/backups/scale

  beat:
    build: ./backend
    container_name: scale_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_DIR: /var/backups/scale
      BACKUP_ACCEL_PREFIX: /protected/backups
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    command: celery -A conf beat --loglevel=info
    depends_on:
      - backend
      - redis
    volumes:
      - backups_volume:/var/backups/scale

  redis:
    image: redis:alpine
    container_name: scale_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data

  frontend:
    build: ./frontend
    container_name: scale_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    container_name: scale_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - backups_volume:/var/backups/scale:ro
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:15 # Versão
    container_name: scale_db # Nome do Container
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME_HML: ${DB_NAME_HML:-scale_hml}
      DB_USER_HML: ${DB_USER_HML:-scale_hml}
      DB_PASSWORD_HML: ${DB_PASSWORD_HML:-scale_hml}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  static_volume:
  media_volume:
  backups_volume:
  redis_data:
